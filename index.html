```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Providence Harbor Crest</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <!-- Logo and animated organisation name -->
        <div class="brand-area">

            <div class="logo-image">
                <img
                    src="images/PROVIDENCE HARBOR CREST.jpeg"
                    alt="Providence Harbor Crest Logo"
                >
            </div>

            <div class="brand-window">
                <span class="brand-name">
                    PROVIDENCE HARBOR CREST
                </span>
            </div>

        </div>


        <!-- Navigation -->
        <ul class="nav-links" id="navLinks">

            <li>
                <a href="#">Home</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

            <li>
                <a href="#">Services</a>
            </li>

            <!-- Contact Dropdown -->
            <li class="contact-dropdown">

                <button
                    class="contact-button"
                    id="contactButton"
                    type="button"
                >
                    Contact
                </button>

                <div class="contact-menu" id="contactMenu">

                    <a
                        id="emailLink"
                        href="https://mail.google.com/mail/?view=cm&fs=1&to=providenceharborcrest@gmail.com"
                    >
                        providenceharborcrest@gmail.com
                    </a>

                </div>

            </li>

        </ul>


        <!-- Mobile Menu Button -->
        <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
        >
            ☰
        </button>

    </nav>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Guided to <span>Greater Heights</span>
            </h1>

            <p>
                A trusted destination for premium living, thoughtful service,
                and experiences designed around security, comfort, and excellence.
            </p>

            <a href="#" class="hero-button">
                Discover More
            </a>

        </div>

    </section>


    <!-- Navigation Script -->
    <script>

        /* ==============================
           MOBILE MENU
        ================================= */

        const menuButton = document.getElementById("menuButton");
        const navLinks = document.getElementById("navLinks");

        menuButton.addEventListener("click", function () {

            const isOpen = navLinks.classList.toggle("mobile-open");

            menuButton.textContent = isOpen ? "✕" : "☰";

            menuButton.setAttribute(
                "aria-expanded",
                isOpen ? "true" : "false"
            );

            menuButton.setAttribute(
                "aria-label",
                isOpen
                    ? "Close navigation menu"
                    : "Open navigation menu"
            );

        });


        /* ==============================
           CONTACT DROPDOWN
        ================================= */

        const contactButton =
            document.getElementById("contactButton");

        const contactMenu =
            document.getElementById("contactMenu");

        contactButton.addEventListener("click", function (event) {

            event.stopPropagation();

            contactMenu.classList.toggle("contact-open");

        });


        /* ==============================
           MOBILE EMAIL HANDLER
        ================================= */

        const emailLink =
            document.getElementById("emailLink");

        emailLink.addEventListener("click", function (event) {

            const isMobile =
                /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isMobile) {

                event.preventDefault();

                window.location.href =
                    "mailto:providenceharborcrest@gmail.com";

            }

        });


        /* ==============================
           CLOSE CONTACT DROPDOWN
        ================================= */

        document.addEventListener("click", function () {

            contactMenu.classList.remove("contact-open");

        });

    </script>

</body>
</html>
```
